name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci --legacy-peer-deps
            - run: npm run test
            # The package build apps install, and the Storybook build Vercel deploys.
            - run: npm run build
            - run: npm run build-storybook
